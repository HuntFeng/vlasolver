[grid]
nx = 10
ny = 125
nvx = 30
nvy = 110
ngc = 3

[grid_electron]
x_min = 0.0
Lx = 20.0
y_min = 0.0
Ly = 20.0
; normalized to electron thermal velocity
vx_min = -4.0
Lvx = 8.0
vy_min = -5.0
Lvy = 10.0

[grid_ion]
x_min = 0.0
Lx = 20.0
y_min = 0.0
Ly = 20.0
; normalized to ion thermal velocity
vx_min = -4.0
Lvx = 8.0
vy_min = -15.0
Lvy = 16.0

[world]
; dt chosen for CFL ~1.5 in electron vy (5*dt/dy ≈ 1.56), safe for semi-Lagrangian PFC
; total_time ≈ 1.3 ion transit times (Ly/u_B ≈ 1212), adequate with Debye initial potential
dt = 5.0e-2
total_time = 1600.0
total_steps = 32000
diag_steps = 320

[output]
folder = data/sheath
prefix = output
