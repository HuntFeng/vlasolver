[grid]
nx = 64
ny = 64
nvx = 64
nvy = 64
ngc = 3

[grid_electron]
x_min = 0.0
Lx = 20.0
y_min = 0.0
Ly = 20.0
; normalized to electron thermal velocity, must be symmetric about 0
vx_min = -6.0
Lvx = 12.0
vy_min = -6.0
Lvy = 12.0

[grid_ion]
x_min = 0.0
Lx = 20.0
y_min = 0.0
Ly = 20.0
; normalized to ion thermal velocity
vx_min = -6.0
Lvx = 12.0
vy_min = -6.0
Lvy = 12.0

[world]
dt = 5.0e-2
total_time = 100
total_steps = 2000
diag_steps = 20

[init]
; OML solution used as the initial state and outer-wall condition, generated with
;   uv run python examples/sheath_oml/sheath_oml.py --write-init examples/sheath_oml/oml_init.csv
oml_profile = examples/sheath_oml/oml_init.csv

[output]
folder = data/sheath_oml
prefix = output
