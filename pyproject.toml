[project]
name = "vlasolver"
version = "0.1.0"
description = "Python packages for visualizing and analyzing the results of Vlasov simulations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.15.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "sympy>=1.14.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "jupynium>=0.2.7",
    "jupytext>=1.19.1",
    "jupyterlab-vim>=4.1.4",
    "nbclassic>=1.3.3",
    "notebook>=7.5.0",
]
